# Dependabot configuration for the lumyx-inc fork. PRs target this fork's
# origin, never upstream.
#
# Schedule: monthly, with a 7-day cooldown so a release has to survive a
# week in the wild before Dependabot offers it. Each ecosystem gets two
# grouped PRs per month: `monthly-batch` (minor + patch) and
# `monthly-majors` (major). Majors are split out because they are the
# bumps most likely to need a deliberate review -- in this repo a projen
# or typescript major can change generated files, which the release path
# is sensitive to. Security updates are not on this schedule -- they open
# as soon as an advisory lands.

version: 2
updates:
  # === npm ===
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, npm]
    cooldown:
      default-days: 7
    # Majors that projen (or .projenrc.ts) deliberately holds back. Bumping
    # them in package.json is pointless: the next `npx projen` reverts them.
    #   typescript              -- 7.x is the native compiler; ts-node,
    #                              ts-jest and typescript-eslint need 5.x
    #   eslint                  -- projen pins ^9 (repo still uses .eslintrc)
    #   @types/node             -- projen derives it from minNodeVersion
    #   commit-and-tag-version  -- projen pins ^12
    #   @actions/core, @actions/github -- v3/v9 are ESM-only; jest and ncc
    #                              cannot resolve their import-only exports
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: commit-and-tag-version
        update-types: [version-update:semver-major]
      - dependency-name: "@actions/core"
        update-types: [version-update:semver-major]
      - dependency-name: "@actions/github"
        update-types: [version-update:semver-major]
    groups:
      monthly-batch:
        patterns: ["*"]
        update-types: [minor, patch]
      monthly-majors:
        patterns: ["*"]
        update-types: [major]

  # === GitHub Actions ===
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns: ["*"]
        update-types: [minor, patch]
      monthly-majors:
        patterns: ["*"]
        update-types: [major]
